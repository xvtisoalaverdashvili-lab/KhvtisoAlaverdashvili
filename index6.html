<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>music chasm-sign up</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <!--ხმის ტალღის ხატულა-->
        <svg class="longo-icon" viewbox="0 0 32 32" aria-hidden="true">
            <rect x="2" y="12" width="2"
            height="8" />
            <rect x="6" y="8" width="2"
            height="16" />
            <rect x="10" y="6" width="2"
            height="20" />
            <rect x="14" y="9" width="2"
            height="14" />
            <rect x="18" y="6" width="2"
            height="20" />
            <rect x="22" y="8" width="2"
            height="16" />
            <rect x="26" y="12" width="2"
            height="8" />
        </svg>

        <span class="logo-text">music chasm</span> 

    </header>
    
    <main class="main">
        <form class="form" action="#"
        method="post">
    <label for="fullname">full name:</label>
    <input type="text" id="fullname" name="fullname" required>
    
    <label for="email">email:</label>
    <input type="email" id="email" name="email" required>
    
    <label for="password">password:</label>
    <input type="password" id="password" name="password" required>
    
    <button type="submit">sign up</button>
    </form>
    </main>
</body>
</html>
